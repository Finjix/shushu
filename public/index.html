<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="description" content="Finjix 的个人主页：技术 × 设计，AI 赋能设计与生产。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Finjix · 技术 × 设计" />
    <meta property="og:description" content="Finjix 的个人主页：技术 × 设计，AI 赋能设计与生产。" />
    <meta property="og:url" content="https://shushu.finjix.top/" />
    <link rel="canonical" href="https://shushu.finjix.top/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css?v=22" />
    <script src="/main.js?v=27" defer></script>
    <title>Finjix</title>
  </head>
  <body>
    <main class="terminal-page" id="main">
      <div class="power-control" id="power-control">
        <button class="power-start" id="power-start" type="button" aria-label="启动 Finjix 主页">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <path d="M32 7v25" />
            <path d="M18.2 16.8a22 22 0 1 0 27.6 0" />
          </svg>
        </button>
        <span class="power-hint" aria-hidden="true">点我开始</span>
      </div>

      <section class="terminal-window" id="terminal-window" aria-label="Finjix 个人主页终端" aria-hidden="true" tabindex="-1">
        <header class="terminal-titlebar">
          <div class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></div>
        </header>

        <div class="terminal-screen">
          <div class="terminal-session">
            <div class="boot-log" id="boot-log" role="log" aria-label="启动日志" aria-live="polite"></div>
            <div class="boot-activity" id="boot-activity" hidden>
              <span class="boot-spinner" aria-hidden="true"></span>
              <span class="boot-activity-label">Loading...</span>
            </div>
            <p class="terminal-command" id="cat-command" aria-hidden="true" hidden><span class="terminal-prompt">finjix@MacBook-Pro ~ %</span><span class="cat-text" id="cat-text">cat welcome.txt</span><span class="typing-cursor" id="typing-cursor" aria-hidden="true"></span></p>

            <div class="welcome-content" id="welcome-content" hidden>
              <p class="terminal-output"><span id="welcome-text" aria-hidden="true">你好啊，欢迎来到我的主页。我是 Finjix，来自广东技术师范大学，数字媒体技术系。</span><span class="sr-only">你好啊，欢迎来到我的主页。我是 Finjix，来自广东技术师范大学，数字媒体技术系。</span></p>

              <div class="terminal-output terminal-intro">
                <h1 class="intro-title" aria-label="技术 × 设计"><span data-typewriter aria-hidden="true">技术</span><span class="intro-cross" data-typewriter aria-hidden="true">×</span><span data-typewriter aria-hidden="true">设计</span></h1>
                <p class="intro-english" aria-hidden="true"><span data-typewriter>Technology</span><span class="intro-english-cross" data-typewriter>×</span><span data-typewriter>Design</span></p>
                <p class="intro-tagline" aria-hidden="true"><span class="tagline-emphasis" data-typewriter>AI 赋能</span><span data-typewriter>提效设计</span><span class="tagline-ampersand" data-typewriter>&amp;</span><span data-typewriter>生产</span></p>
                <span class="sr-only">Technology × Design</span>
                <span class="sr-only">AI 赋能 提效设计 &amp; 生产</span>
              </div>

              <div class="terminal-history" id="terminal-history" aria-live="polite"></div>
              <p class="terminal-command terminal-ready" id="terminal-ready" hidden><span class="terminal-prompt">finjix@MacBook-Pro ~ %</span><span class="terminal-cursor" id="terminal-cursor" aria-hidden="true"></span><input class="terminal-input" id="terminal-input" type="text" aria-label="输入终端命令" autocomplete="off" autocapitalize="off" spellcheck="false" /></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
